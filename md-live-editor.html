/* ---- 確認ダイアログ（既定のフォーカスは「キャンセル」側） ---- */
const modalBackdrop = document.getElementById('modalBackdrop');
const modalMsg = document.getElementById('modalMsg');
const modalOk = document.getElementById('modalOk');
const modalCancel = document.getElementById('modalCancel');

function confirmDialog(message, okLabel){
  return new Promise(resolve=>{
    modalMsg.textContent = message;
    modalOk.textContent = okLabel || 'OK';
    modalBackdrop.classList.add('open');
    modalCancel.focus();
    const finish = (result)=>{
      modalBackdrop.classList.remove('open');
      modalOk.removeEventListener('click', onOk);
      modalCancel.removeEventListener('click', onCancel);
      modalBackdrop.removeEventListener('mousedown', onBackdrop);
      document.removeEventListener('keydown', onKey, true);
      resolve(result);
    };
    const onOk = ()=>finish(true);
    const onCancel = ()=>finish(false);
    const onBackdrop = (e)=>{ if(e.target===modalBackdrop) finish(false); };
    const onKey = (e)=>{
      if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); finish(false); }
      else if(e.key==='Tab'){
        e.preventDefault();
        (document.activeElement===modalOk ? modalCancel : modalOk).focus();
      }
    };
    modalOk.addEventListener('click', onOk);
    modalCancel.addEventListener('click', onCancel);
    modalBackdrop.addEventListener('mousedown', onBackdrop);
    document.addEventListener('keydown', onKey, true);
  });
}

/* ---- ファイル名まわり ---- */
function normalizeFileName(raw){
  let n = (raw || '').trim();
  if(n && !FILE_EXT_RE.test(n)) n += '.md';     // 拡張子がなければ .md を付ける（付けないと一覧に出てこないため）
  return n;
}
function checkFileName(name){
  const base = name.replace(FILE_EXT_RE, '').trim();
  if(!base || base==='.' || base==='..') return 'ファイル名を入力してください';
  if(INVALID_NAME_RE.test(name)) return '使えない文字（\\ / : * ? " < > |）が含まれています';
  return '';
}
/* 同名の項目があるか: 'none' | 'self'（大文字小文字違いの同一ファイル） | 'other'
   isDir を true にするとフォルダとして重複チェックする（フォルダ作成用） */
async function findConflict(dirHandle, name, selfHandle, isDir){
  try{
    const h = isDir ? await dirHandle.getDirectoryHandle(name) : await dirHandle.getFileHandle(name);
    if(selfHandle && await h.isSameEntry(selfHandle)) return 'self';
    return 'other';
  }catch(err){
    if(!(err && err.name==='NotFoundError')) return 'other';   // 判断できないときは上書きを避ける
  }
  // 同名でファイル/フォルダの種類だけ違うものがないかも確認する
  try{
    if(isDir) await dirHandle.getFileHandle(name);
    else await dirHandle.getDirectoryHandle(name);
    return 'other';
  }catch(err2){
    return (err2 && err2.name==='NotFoundError') ? 'none' : 'other';
  }
}
function checkFolderName(name){
  const base = (name || '').trim();
  if(!base || base==='.' || base==='..') return 'フォルダ名を入力してください';
  if(INVALID_NAME_RE.test(base)) return '使えない文字（\\ / : * ? " < > |）が含まれています';
  return '';
}
async function isCurrentFile(handle){
  if(!fileOpen || !currentFileHandle) return false;
  try{ return await currentFileHandle.isSameEntry(handle); }catch(err){ return false; }
}
function closeCurrentFile(){
  clearTimeout(saveTimer);
  fileOpen = false; currentFileHandle = null; currentFilename = '';
  activeFilePath = null; isDirty = false;
  init();
}

/* ---- ツリー描画 ---- */
async function readDir(dirHandle){
  const dirs = [], files = [];
  for await (const [name, handle] of dirHandle.entries()){
    if(handle.kind==='directory'){
      if(name.startsWith('.') || name==='node_modules') continue;
      dirs.push({name, handle});
    } else if(FILE_EXT_RE.test(name)){
      files.push({name, handle});
    }
  }
  const cmp = (a,b)=>a.name.localeCompare(b.name, 'ja', {numeric:true});
  dirs.sort(cmp); files.sort(cmp);
  return {dirs, files};
}

function actionBtn(text, title, handler, danger){
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = text; b.title = title; b.setAttribute('aria-label', title);
  if(danger) b.classList.add('danger');
  b.addEventListener('click', (e)=>{ e.stopPropagation(); handler(); });
  return b;
}

function buildRow(node){
  const row = document.createElement('div');
  row.className = 'tree-row ' + (node.kind==='dir' ? 'is-dir' : 'is-file');
  row.style.paddingLeft = (8 + node.depth*14) + 'px';
  row.title = node.path;
  const toggle = document.createElement('span');
  toggle.className = 'tree-toggle';
  toggle.textContent = node.kind==='dir' ? '▶' : '';
  const label = document.createElement('span');
  label.className = 'tree-label';
  label.textContent = node.name;
  const actions = document.createElement('span');
  actions.className = 'tree-actions';
  if(node.kind==='dir'){
    actions.appendChild(actionBtn('＋', 'このフォルダに新しいファイルを作成', ()=>startNewFile(node)));
    actions.appendChild(actionBtn('📁+', 'このフォルダに新しいフォルダを作成', ()=>startNewFolder(node)));
    actions.appendChild(actionBtn('✎', '名前を変更', ()=>startRename(node)));
    actions.appendChild(actionBtn('🗑', '削除', ()=>deleteFolder(node), true));
    row.addEventListener('click', ()=>toggleDir(node));
  } else {
    actions.appendChild(actionBtn('✎', '名前を変更', ()=>startRename(node)));
    actions.appendChild(actionBtn('🗑', '削除', ()=>deleteFile(node), true));
    row.addEventListener('click', ()=>openFromTree(node));
  }
  row.append(toggle, label, actions);
  node.rowEl = row;
  return row;
}

async function renderDir(container, dirHandle, dirPath, depth){
  const {dirs, files} = await readDir(dirHandle);

  for(const d of dirs){
    const path = dirPath + d.name + '/';
    const node = {kind:'dir', name:d.name, path, handle:d.handle, parentHandle:dirHandle, parentPath:dirPath, depth};
    const row = buildRow(node);
    const open = expandedDirs.has(path);
    row.classList.toggle('open', open);
    const children = document.createElement('div');
    children.className = 'tree-children';
    children.hidden = !open;
    node.childrenEl = children;
    container.append(row, children);
    if(open) await renderDir(children, d.handle, path, depth+1);
  }

  for(const f of files){
    const path = dirPath + f.name;
    const node = {kind:'file', name:f.name, path, handle:f.handle, parentHandle:dirHandle, parentPath:dirPath, depth};
    const row = buildRow(node);
    if(path===activeFilePath) row.classList.add('active');
    container.appendChild(row);
  }

  if(!dirs.length && !files.length){
    const empty = document.createElement('div');
    if(depth===0){
      empty.className = 'file-list-empty';
      empty.textContent = 'Markdown / テキストファイルが見つかりません。右上の＋から新しく作成できます。';
    } else {
      empty.className = 'tree-empty';
      empty.style.paddingLeft = (8 + depth*14 + 18) + 'px';
      empty.textContent = '（空）';
    }
    container.appendChild(empty);
  }
}

async function refreshTree(){
  if(!rootDirHandle) return;
  const token = ++treeRenderToken;
  sidebarTitleEl.textContent = '📁 ' + rootDirHandle.name;
  const tree = document.createElement('div');
  tree.className = 'tree-root';
  try{
    await renderDir(tree, rootDirHandle, '', 0);
  }catch(err){
    if(token===treeRenderToken) showNotice('フォルダの内容を読み込めませんでした');
    return;
  }
  if(token!==treeRenderToken) return;
  const scrollTop = fileListEl.scrollTop;
  fileListEl.replaceChildren(tree);
  fileListEl.scrollTop = scrollTop;
}

/* ---- フォルダの開閉 ---- */
async function expandDir(node){
  expandedDirs.add(node.path);
  node.rowEl.classList.add('open');
  node.childrenEl.hidden = false;
  const tmp = document.createElement('div');
  try{
    await renderDir(tmp, node.handle, node.path, node.depth+1);   // 開くたびに最新の内容を読む
  }catch(err){
    expandedDirs.delete(node.path);
    node.rowEl.classList.remove('open');
    node.childrenEl.hidden = true;
    showNotice('フォルダを読み込めませんでした');
    return;
  }
  node.childrenEl.replaceChildren(...tmp.childNodes);
}
async function toggleDir(node){
  if(expandedDirs.has(node.path)){
    expandedDirs.delete(node.path);
    node.rowEl.classList.remove('open');
    node.childrenEl.hidden = true;
  } else {
    await expandDir(node);
  }
}

/* ---- 本文中のリンク（例: [会話ページ](talk.md)）を開く ---- */
function notifyLinkIssue(msg){
  if(rootDirHandle) showNotice(msg); else alert(msg);
}

/* href を現在開いているファイルからの相対パスとして解決し、ルートからのパスに正規化する */
function resolveRelativePath(href){
  let h = href.split('#')[0].split('?')[0];
  try{ h = decodeURIComponent(h); }catch(err){}
  if(!h) return null;
  if(h.startsWith('/')) h = h.slice(1);
  const baseDir = activeFilePath ? activeFilePath.replace(/[^/]*$/, '') : '';
  const parts = (baseDir + h).split('/').filter(p=>p!=='' && p!=='.');
  const stack = [];
  for(const p of parts){
    if(p==='..') stack.pop();
    else stack.push(p);
  }
  return stack.join('/');
}

/* ルートディレクトリからパスをたどり、対象ファイルの親フォルダとファイル名を得る */
async function walkToFile(path){
  const segs = path.split('/').filter(p=>p!=='');
  const name = segs.pop();
  let dir = rootDirHandle;
  for(const seg of segs){ dir = await dir.getDirectoryHandle(seg); }
  return {dirHandle: dir, name};
}

function expandAncestors(path){
  const parts = path.split('/'); parts.pop();
  let acc = '';
  for(const p of parts){ if(!p) continue; acc += p + '/'; expandedDirs.add(acc); }
}

async function openMdLink(href){
  if(!href) return;
  // http(s)・mailto などスキーム付きの絶対URLは新しいタブで開く
  if(/^[a-z][a-z0-9+.-]*:/i.test(href) || href.startsWith('//')){
    window.open(href, '_blank', 'noopener,noreferrer');
    return;
  }
  if(!rootDirHandle){
    notifyLinkIssue('リンク先を開くには、まずフォルダを開いてください');
    return;
  }
  const target = resolveRelativePath(href);
  if(!target){ notifyLinkIssue('リンク先のパスを解決できませんでした'); return; }
  if(fileOpen && isDirty){
    const ok = await confirmDialog('編集中のファイルに未保存の変更があります。\n保存せずに、リンク先のファイルを開きますか？', '破棄して開く');
    if(!ok) return;
  }
  try{
    const {dirHandle, name} = await walkToFile(target);
    const handle = await dirHandle.getFileHandle(name);
    const file = await handle.getFile();
    const text = await file.text();
    expandAncestors(target);
    openText(text, name, handle, target);
    if(window.innerWidth <= 640) appEl.classList.remove('folder-open');
    await refreshTree();
  }catch(err){
    notifyLinkIssue('「' + href + '」を開けませんでした');
  }
}

/* ---- 新規ファイル ---- */
async function startNewFile(node){
  if(!rootDirHandle) return;
  if(inlineEditCancel) inlineEditCancel();
  let container, depth;
  if(node.kind==='root'){
    container = fileListEl.querySelector('.tree-root');
    depth = 0;
  } else {
    if(!expandedDirs.has(node.path)) await expandDir(node);
    container = node.childrenEl;
    depth = node.depth + 1;
  }
  if(!container || !container.isConnected) return;
  if(inlineEditCancel) inlineEditCancel();

  const row = document.createElement('div');
  row.className = 'tree-row editing';
  row.style.paddingLeft = (8 + depth*14) + 'px';
  const spacer = document.createElement('span');
  spacer.className = 'tree-toggle';
  const input = document.createElement('input');
  input.className = 'tree-input'; input.type = 'text';
  input.placeholder = '新しいファイル名（.md）';
  input.spellcheck = false;
  row.append(spacer, input);
  container.insertBefore(row, container.firstChild);
  input.focus();
  row.scrollIntoView({block:'nearest'});

  let finished = false;
  const cancel = ()=>{
    if(finished) return;
    finished = true;
    row.remove();
    if(inlineEditCancel===cancel) inlineEditCancel = null;
  };
  inlineEditCancel = cancel;
  input.addEventListener('keydown', async (e)=>{
    if(e.isComposing || e.keyCode===229) return;      // 日本語入力の確定Enterは無視
    if(e.key==='Enter'){
      e.preventDefault();
      const ok = await createFile(node.handle, node.kind==='root' ? '' : node.path, input.value);
      if(ok) cancel();
    } else if(e.key==='Escape'){
      e.preventDefault(); cancel();
    }
  });
  input.addEventListener('blur', cancel);
}

async function createFile(dirHandle, dirPath, rawName){
  const name = normalizeFileName(rawName);
  const problem = checkFileName(name);
  if(problem){ showNotice(problem); return false; }
  if(await findConflict(dirHandle, name, null) !== 'none'){
    showNotice('「' + name + '」はすでに存在します');
    return false;
  }
  if(!(await ensureWritePermission(rootDirHandle))){
    showNotice('フォルダへの書き込みが許可されていません');
    return false;
  }
  let handle;
  try{
    handle = await dirHandle.getFileHandle(name, {create:true});
    const w = await handle.createWritable();
    await w.close();
  }catch(err){
    showNotice('「' + name + '」を作成できませんでした');
    return false;
  }

  // 編集中の内容が未保存なら、新しいファイルで置き換えてよいか確認する
  let openIt = true;
  if(fileOpen && isDirty){
    openIt = await confirmDialog('編集中のファイルに未保存の変更があります。\n保存せずに、新しく作ったファイルを開きますか？', '破棄して開く');
  }
  if(openIt){
    openText('', name, handle, dirPath + name);
    if(window.innerWidth <= 640) appEl.classList.remove('folder-open');
  }
  await refreshTree();
  if(openIt){
    editor.focus();
    placeCaretEnd(editor.lastElementChild);
  }
  return true;
}

/* ---- 改名 ---- */
function startRename(node){
  if(inlineEditCancel) inlineEditCancel();
  const row = node.rowEl;
  const label = row.querySelector('.tree-label');
  const input = document.createElement('input');
  input.className = 'tree-input'; input.type = 'text';
  input.value = node.name;
  input.spellcheck = false;
  row.classList.add('editing');
  label.replaceWith(input);
  input.focus();
  if(node.kind==='file'){
    const dot = node.name.lastIndexOf('.');
    input.setSelectionRange(0, dot > 0 ? dot : node.name.length);   // 拡張子の手前まで選択
  } else {
    input.setSelectionRange(0, node.name.length);   // フォルダ名は全体を選択
  }

  let finished = false;
  const cancel = ()=>{
    if(finished) return;
    finished = true;
    input.replaceWith(label);
    row.classList.remove('editing');
    if(inlineEditCancel===cancel) inlineEditCancel = null;
  };
  inlineEditCancel = cancel;
  input.addEventListener('click', (e)=>e.stopPropagation());
  input.addEventListener('keydown', async (e)=>{
    if(e.isComposing || e.keyCode===229) return;
    if(e.key==='Enter'){
      e.preventDefault();
      if(node.kind==='dir'){
        if((input.value||'').trim()===node.name){ cancel(); return; }
        const ok = await renameFolder(node, input.value);
        if(ok) cancel();
      } else {
        if(normalizeFileName(input.value)===node.name){ cancel(); return; }
        const ok = await renameFile(node, input.value);
        if(ok) cancel();
      }
    } else if(e.key==='Escape'){
      e.preventDefault(); cancel();
    }
  });
  input.addEventListener('blur', cancel);
}

async function renameFile(node, rawName){
  const newName = normalizeFileName(rawName);
  const problem = checkFileName(newName);
  if(problem){ showNotice(problem); return false; }
  const conflict = await findConflict(node.parentHandle, newName, node.handle);
  if(conflict==='other'){
    showNotice('「' + newName + '」はすでに存在します');
    return false;
  }
  if(!(await ensureWritePermission(rootDirHandle))){
    showNotice('フォルダへの書き込みが許可されていません');
    return false;
  }
  const wasCurrent = await isCurrentFile(node.handle);

  try{
    let moved = false;
    if(typeof node.handle.move==='function'){
      try{ await node.handle.move(newName); moved = true; }catch(err){ moved = false; }
    }
    if(!moved){
      // 大文字小文字だけの変更（同一ファイル）でコピー＋削除をすると自分自身を消してしまうため、行わない
      if(conflict==='self') throw new Error('rename-unsupported');
      const file = await node.handle.getFile();
      const nh = await node.parentHandle.getFileHandle(newName, {create:true});
      try{
        const w = await nh.createWritable();
        await w.write(file);
        await w.close();
      }catch(err){
        try{ await node.parentHandle.removeEntry(newName); }catch(_){}
        throw err;
      }
      await node.parentHandle.removeEntry(node.name);
    }
  }catch(err){
    showNotice('名前を変更できませんでした');
    return false;
  }

  if(wasCurrent){
    try{ currentFileHandle = await node.parentHandle.getFileHandle(newName); }catch(err){}
    currentFilename = newName;
    activeFilePath = node.parentPath + newName;
    fnameEl.textContent = newName;
  }
  await refreshTree();
  return true;
}

/* ---- 削除 ---- */
async function deleteFile(node){
  if(inlineEditCancel) inlineEditCancel();
  const wasCurrent = await isCurrentFile(node.handle);
  let msg = '「' + node.path + '」を削除しますか？\nこの操作は元に戻せません。';
  if(wasCurrent && isDirty) msg += '\n（編集中の未保存の変更も失われます）';
  if(!(await confirmDialog(msg, '削除'))) return;
  if(!(await ensureWritePermission(rootDirHandle))){
    showNotice('フォルダへの書き込みが許可されていません');
    return;
  }
  try{
    await node.parentHandle.removeEntry(node.name);
  }catch(err){
    showNotice('「' + node.name + '」を削除できませんでした');
    return;
  }
  if(wasCurrent) closeCurrentFile();
  await refreshTree();
}

/* ---- フォルダの中身をまるごとコピーする（フォルダの move() に非対応な環境向けのフォールバック） ---- */
async function copyDirContents(srcHandle, destHandle){
  for await (const [name, handle] of srcHandle.entries()){
    if(handle.kind==='file'){
      const file = await handle.getFile();
      const nh = await destHandle.getFileHandle(name, {create:true});
      const w = await nh.createWritable();
      await w.write(file);
      await w.close();
    } else {
      const nh = await destHandle.getDirectoryHandle(name, {create:true});
      await copyDirContents(handle, nh);
    }
  }
}

/* 展開状態（expandedDirs）に記録されたパスの接頭辞を、フォルダの改名/移動にあわせて書き換える */
function remapExpandedDirs(oldPrefix, newPrefix){
  const toUpdate = [];
  expandedDirs.forEach(p=>{ if(p===oldPrefix || p.startsWith(oldPrefix)) toUpdate.push(p); });
  for(const p of toUpdate){
    expandedDirs.delete(p);
    expandedDirs.add(newPrefix + p.slice(oldPrefix.length));
  }
}

/* ---- フォルダの改名 ---- */
async function renameFolder(node, rawName){
  const newName = (rawName || '').trim();
  const problem = checkFolderName(newName);
  if(problem){ showNotice(problem); return false; }
  const conflict = await findConflict(node.parentHandle, newName, node.handle, true);
  if(conflict==='other'){
    showNotice('「' + newName + '」はすでに存在します');
    return false;
  }
  if(!(await ensureWritePermission(rootDirHandle))){
    showNotice('フォルダへの書き込みが許可されていません');
    return false;
  }
  const oldPrefix = node.path;
  const newPrefix = node.parentPath + newName + '/';
  const wasCurrentInside = fileOpen && activeFilePath && activeFilePath.startsWith(oldPrefix);

  try{
    let moved = false;
    if(typeof node.handle.move==='function'){
      try{ await node.handle.move(newName); moved = true; }catch(err){ moved = false; }
    }
    if(!moved){
      // 大文字小文字だけの変更（同一フォルダ）でコピー＋削除をすると自分自身を消してしまうため、行わない
      if(conflict==='self') throw new Error('rename-unsupported');
      const nh = await node.parentHandle.getDirectoryHandle(newName, {create:true});
      await copyDirContents(node.handle, nh);
      await node.parentHandle.removeEntry(node.name, {recursive:true});
    }
  }catch(err){
    showNotice('フォルダ名を変更できませんでした');
    return false;
  }

  remapExpandedDirs(oldPrefix, newPrefix);
  if(wasCurrentInside){
    activeFilePath = newPrefix + activeFilePath.slice(oldPrefix.length);
  }
  await refreshTree();
  return true;
}

/* ---- フォルダの削除 ---- */
async function deleteFolder(node){
  if(inlineEditCancel) inlineEditCancel();
  const wasCurrentInside = fileOpen && activeFilePath && activeFilePath.startsWith(node.path);
  let msg = '「' + node.path + '」を削除しますか？\nフォルダの中身もすべて削除され、元に戻せません。';
  if(wasCurrentInside && isDirty) msg += '\n（編集中の未保存の変更も失われます）';
  if(!(await confirmDialog(msg, '削除'))) return;
  if(!(await ensureWritePermission(rootDirHandle))){
    showNotice('フォルダへの書き込みが許可されていません');
    return;
  }
  try{
    await node.parentHandle.removeEntry(node.name, {recursive:true});
  }catch(err){
    showNotice('「' + node.name + '」を削除できませんでした');
    return;
  }
  expandedDirs.delete(node.path);
  Array.from(expandedDirs).forEach(p=>{ if(p.startsWith(node.path)) expandedDirs.delete(p); });
  if(wasCurrentInside) closeCurrentFile();
  await refreshTree();
}

fileInput.addEventListener('change', (e)=>{
  const f = e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = ()=>{ openText(reader.result, f.name, null); };
  reader.readAsText(f);
  fileInput.value='';
});

['dragenter','dragover'].forEach(ev=>{
  wrapEl.addEventListener(ev, (e)=>{ e.preventDefault(); wrapEl.classList.add('dragover'); });
});
['dragleave','dragend'].forEach(ev=>{
  wrapEl.addEventListener(ev, (e)=>{ if(e.target===wrapEl || ev==='dragend') wrapEl.classList.remove('dragover'); });
});
wrapEl.addEventListener('drop', async (e)=>{
  e.preventDefault();
  wrapEl.classList.remove('dragover');
  const item = e.dataTransfer.items && e.dataTransfer.items[0];
  if(item && item.kind==='file'){
    if(item.getAsFileSystemHandle){
      try{
        const handle = await item.getAsFileSystemHandle();
        if(handle && handle.kind==='file'){
          const file = await handle.getFile();
          const text = await file.text();
          openText(text, file.name, handle);
          return;
        }
      }catch(err){}
    }
    const file = item.getAsFile ? item.getAsFile() : e.dataTransfer.files[0];
    if(file){
      const reader = new FileReader();
      reader.onload = ()=>{ openText(reader.result, file.name, null); };
      reader.readAsText(file);
    }
  }
});

async function saveFile(){
  if(!fileOpen) return;
  const md = serialize();

  if(currentFileHandle){
    const ok = await ensureWritePermission(currentFileHandle);
    if(ok){
      try{
        const writable = await currentFileHandle.createWritable();
        await writable.write(md);
        await writable.close();
        flashSaved();
        markClean();
        return;
      }catch(err){}
    }
  }

  let handled = false;
  try{
    if(window.claude && window.claude.use){
      const downloads = await window.claude.use('downloads');
      if(downloads){
        await downloads.save({filename: currentFilename, data: md});
        handled = true;
      }
    }
  }catch(err){}
  if(!handled){
    try{
      const blob = new Blob([md], {type:'text/markdown'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = currentFilename;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    }catch(err){}
  }
  markClean();
}

document.addEventListener('keydown', (e)=>{
  if((e.metaKey || e.ctrlKey) && (e.key==='s' || e.key==='S')){
    e.preventDefault();
    saveFile();
    return;
  }
  if((e.metaKey || e.ctrlKey) && !e.altKey && (e.key==='z' || e.key==='Z')){
    e.preventDefault();
    if(e.shiftKey) redo(); else undo();
  }
});
